<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Furia Animal · Tablero</title>
<link rel="icon" type="image/png" href="favicon-32.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{--bg1:#1556c4;--bg2:#0b2a63;--ink:#0d1a33;--card:rgba(8,30,80,.6);--line:rgba(255,255,255,.14);--fg:#fff;--mute:#b9cdf5;
  --gold:#ffd23d;--green:#62d84b;--red:#ff5a4d;--blue:#55b4ff;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,var(--bg1),var(--bg2));color:var(--fg);font:800 15px/1.4 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:400 clamp(28px,7vw,40px)/1 var(--display);color:var(--gold);text-shadow:0 3px 0 #c97700,0 6px 0 var(--ink)}
.sub{color:var(--mute);font-size:13px}
.btn{font:400 16px var(--display);color:var(--ink);background:linear-gradient(#ffe061,#f2a300);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--mute);border-color:var(--line);box-shadow:none;font:800 13px var(--body)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpis .live{grid-column:1/-1}}
.k .lab{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.k .num{font:400 44px/1.05 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.k .note{color:var(--mute);font-size:12px}
.live .num{color:var(--green);display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(98,216,75,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(98,216,75,0)}100%{box-shadow:0 0 0 0 rgba(98,216,75,0)}}
h2{margin:0 0 12px;font:400 20px var(--display)}
.legend{display:flex;gap:14px;color:var(--mute);font-size:12px;margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:170px;overflow-x:auto}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:22px}
.bars{display:flex;gap:2px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.bar{width:45%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.bar.v{background:var(--blue)}.bar.p{background:var(--gold)}
.col .d{font-size:10px;color:var(--mute);white-space:nowrap}
.col .t{font-size:9px;color:var(--fg);font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.n,.tbl td.n{text-align:right}
.tbl td.rank{color:var(--mute);width:28px}
.tbl tr:first-child td.name{color:var(--gold)}
.scroll{overflow-x:auto}
.empty{color:var(--mute);text-align:center;padding:18px}
.gate{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:28px 16px}
.gate p{margin:0;color:var(--mute);max-width:42ch}
.err{color:#ffb4ab}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Furia Animal</h1><div class="sub" id="who">Tablero de jugadores</div></div>
    <button class="btn ghost" id="out" hidden>Salir</button>
  </header>

  <section class="card gate" id="gate">
    <p id="gate-msg"><span class="dot" style="display:inline-block;width:10px;height:10px;vertical-align:1px;margin-right:6px"></span>En vivo</p>
    <button class="btn" id="in" hidden>Entrar con Google</button>
  </section>

  <div id="dash" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="kpis">
      <div class="card k live"><div class="lab">Jugando ahora</div><div class="num"><span class="dot"></span><span id="k-live">0</span></div><div class="note" id="k-live-note">en vivo</div></div>
      <div class="card k"><div class="lab">Visitas hoy</div><div class="num" id="k-v">0</div><div class="note" id="k-v-note">&nbsp;</div></div>
      <div class="card k"><div class="lab">Partidas hoy</div><div class="num" id="k-p">0</div><div class="note" id="k-p-note">&nbsp;</div></div>
    </div>

    <section class="card">
      <h2>Últimos 14 días</h2>
      <div class="legend"><span><i style="background:var(--blue)"></i>Visitas</span><span><i style="background:var(--gold)"></i>Partidas</span></div>
      <div class="chart" id="chart"></div>
    </section>

    <section class="card">
      <h2>Jugadores más frecuentes</h2>
      <div class="scroll"><table class="tbl"><thead><tr><th></th><th>Nombre</th><th class="n">Visitas</th><th class="n">Partidas</th><th class="n">Última vez</th></tr></thead><tbody id="names"></tbody></table></div>
    </section>
  </div>
</div>

<script>
const FB_CONFIG={apiKey:"AIzaSyDvqxhfXo9v0ZHLWVSL7oxZ3JxRgxS4XEY",authDomain:"furia-animal.firebaseapp.com",databaseURL:"https://furia-animal-default-rtdb.firebaseio.com",projectId:"furia-animal",storageBucket:"furia-animal.firebasestorage.app",messagingSenderId:"705470644551",appId:"1:705470644551:web:bbf8d9885ea1f4a8120c62"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey=ms=>new Date(ms-3*3600e3).toISOString().slice(0,10);
const ago=ms=>{if(!ms)return'—';const m=Math.round((Date.now()-ms)/60000);if(m<1)return'recién';if(m<60)return'hace '+m+' min';const h=Math.round(m/60);if(h<24)return'hace '+h+' h';return'hace '+Math.round(h/24)+' d'};

if(!FB_CONFIG){$('gate-msg').innerHTML='Falta conectar la base de datos (Firebase).<br>Cuando esté configurada, acá vas a ver los jugadores en vivo.';$('in').hidden=true}
else{
  const load=src=>new Promise((r,j)=>{const x=document.createElement('script');x.src=src;x.onload=r;x.onerror=j;document.head.appendChild(x)});
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  load(B+'firebase-app-compat.js').then(()=>Promise.all([load(B+'firebase-auth-compat.js'),load(B+'firebase-database-compat.js')])).then(boot)
    .catch(()=>{$('gate-msg').textContent='No pude cargar Firebase. Revisá tu conexión y recargá.'});
}

function boot(){
  firebase.initializeApp(FB_CONFIG);
  const auth=firebase.auth(),db=firebase.database();
  $('in').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{$('gate-msg').innerHTML='<span class="err">No se pudo entrar: '+esc(e.message)+'</span>'});
  $('out').onclick=()=>auth.signOut();
  let offs=[];
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  auth.onAuthStateChanged(u=>{
    if(!u){$('gate-msg').textContent='Este tablero es privado. Entrá con tu cuenta de Google para verlo.';$('in').hidden=false}
    offs.forEach(f=>f());offs=[];
    $('gate').hidden=!!u;$('dash').hidden=!u;$('out').hidden=!u;
    $('dash').style.display=u?'flex':'none';
    $('who').textContent=u?('Hola, '+(u.displayName||u.email)):'Tablero de jugadores';
    if(!u)return;
    const fail=e=>{$('gate').hidden=false;$('dash').style.display='none';$('gate-msg').innerHTML='<span class="err">Esta cuenta no tiene acceso al tablero.</span>'};
    // en vivo
    let pres={};
    const drawLive=()=>{const now=Date.now(),act=Object.values(pres).filter(p=>p&&p.t&&now-p.t<150000);
      $('k-live').textContent=act.length;
      const pl=act.filter(p=>p.m&&p.m!=='menu').length;$('k-live-note').textContent=act.length?(pl+' en partida · '+(act.length-pl)+' en el menú'):'nadie conectado';};
    const pr=db.ref('presence');pr.on('value',s=>{pres=s.val()||{};drawLive()},fail);offs.push(()=>pr.off());
    const iv=setInterval(drawLive,15000);offs.push(()=>clearInterval(iv));
    // días
    const dr=db.ref('days').orderByKey().limitToLast(14);
    dr.on('value',s=>{const d=s.val()||{},t=dayKey(Date.now()),y=dayKey(Date.now()-864e5);
      const td=d[t]||{},yd=d[y]||{};
      $('k-v').textContent=td.visits||0;$('k-p').textContent=td.plays||0;
      $('k-v-note').textContent='ayer: '+(yd.visits||0);$('k-p-note').textContent='ayer: '+(yd.plays||0);
      const keys=[];for(let i=13;i>=0;i--)keys.push(dayKey(Date.now()-i*864e5));
      const mx=Math.max(1,...keys.map(k=>Math.max((d[k]||{}).visits||0,(d[k]||{}).plays||0)));
      $('chart').innerHTML=keys.map(k=>{const v=(d[k]||{}).visits||0,p=(d[k]||{}).plays||0;
        return`<div class="col" title="${k}: ${v} visitas, ${p} partidas"><div class="t">${v||''}</div><div class="bars"><div class="bar v" style="height:${v/mx*100}%"></div><div class="bar p" style="height:${p/mx*100}%"></div></div><div class="d">${+k.slice(8)}</div></div>`}).join('');
    },fail);offs.push(()=>dr.off());
    // nombres
    const nr=db.ref('names');
    nr.on('value',s=>{const rows=Object.values(s.val()||{}).filter(r=>r&&r.n).sort((a,b)=>(b.p||0)-(a.p||0)||(b.v||0)-(a.v||0)).slice(0,30);
      $('names').innerHTML=rows.length?rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td class="name">${esc(r.n)}</td><td class="n">${r.v||0}</td><td class="n">${r.p||0}</td><td class="n">${ago(r.last)}</td></tr>`).join('')
        :'<tr><td colspan="5" class="empty">Todavía nadie jugó con su nombre.</td></tr>';
    },fail);offs.push(()=>nr.off());
  });
}
</script>
</body>
</html>
