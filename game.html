<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1556c4">
<title>Furia Animal</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Furia Animal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
/* Layout: one-screen mobile game — stacked screens, battle = rival arriba / log al medio / vos abajo / botonera 2x2 */
:root{
  --sky1:#45c2ff; --sky2:#1556c4; --deep:#0b2a63;
  --ink:#16203a; --white:#ffffff;
  --gold:#ffd23d; --gold-d:#c97700;
  --green:#62d84b; --green-d:#2a8a1c;
  --blue:#44a8ff; --blue-d:#1b5fc0;
  --red:#ff4d4d; --red-d:#a81c1c;
  --cyan:#6ff3ff;
  --panel:rgba(8,30,80,.55);
  --display:"Lilita One","Arial Black",Impact,system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,var(--sky1),var(--sky2) 60%,var(--deep));
  color:var(--white);font-family:var(--body);font-weight:800;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background:repeating-linear-gradient(45deg,#fff 0 18px,transparent 18px 40px)}
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.t{font-family:var(--display);letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 2px #000;-webkit-text-stroke:1px rgba(0,0,0,.35)}

/* Buttons */
.btn{font-family:var(--display);font-size:22px;color:var(--white);border:3px solid var(--ink);border-radius:18px;
  padding:14px 18px;cursor:pointer;position:relative;text-shadow:0 2px 0 rgba(0,0,0,.5);
  background:linear-gradient(180deg,#fff7 0 8%,transparent 9%),linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:0 6px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.btn[disabled]{filter:grayscale(1) brightness(.75);cursor:default;transform:none;box-shadow:0 6px 0 var(--ink)}
.b-gold{--c1:#ffe061;--c2:#f2a300;color:var(--ink);text-shadow:0 1px 0 #fff8}
.b-green{--c1:#7ee85f;--c2:#2fa51f}
.b-blue{--c1:#63bbff;--c2:#1f6fd6}
.b-red{--c1:#ff7a6b;--c2:#d92b2b}
.b-cyan{--c1:#8ff6ff;--c2:#19a9c9;color:var(--ink);text-shadow:0 1px 0 #fff8}
.btn small{display:block;font-family:var(--body);font-size:12px;font-weight:800;opacity:.9;text-shadow:none;margin-top:2px}

/* Home */
.logo{text-align:center;margin-top:4vh}
.logo h1{margin:0;font-family:var(--display);font-size:clamp(46px,14vw,72px);line-height:.9;color:var(--gold);
  text-shadow:0 5px 0 var(--gold-d),0 9px 0 var(--ink),0 14px 22px rgba(0,0,0,.4);transform:rotate(-3deg);-webkit-text-stroke:2px var(--ink)}
.logo .sub{display:inline-block;margin-top:14px;background:var(--red);border:3px solid var(--ink);border-radius:12px;padding:4px 14px;font-family:var(--display);font-size:20px;transform:rotate(2deg);box-shadow:0 4px 0 var(--ink)}
.parade{margin:14px -40px 6px;overflow:hidden;white-space:nowrap;font-size:44px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.parade span{display:inline-block;animation:march 40s linear infinite}
@keyframes march{to{transform:translateX(-50%)}}
.menu{display:flex;flex-direction:column;gap:13px;margin-top:auto;padding-bottom:10px}
.namebox{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid #fff3;border-radius:14px;padding:8px 12px}
.namebox label{font-size:14px;opacity:.85;white-space:nowrap}
.namebox input,.codein{flex:1;min-width:0;font:inherit;font-family:var(--display);font-size:22px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 10px}
.foot{font-size:12px;opacity:.75;text-align:center;font-weight:700}
.mute{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:5;width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:var(--panel);font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}

/* Panels */
.card{background:var(--panel);border:3px solid #fff3;border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.center{display:flex;flex-direction:column;gap:16px;justify-content:center;flex:1}
.bigcode{font-family:var(--display);font-size:64px;letter-spacing:10px;text-align:center;color:var(--gold);text-shadow:0 4px 0 var(--ink)}
.muted{font-weight:700;opacity:.85;text-align:center;line-height:1.4}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* Spin */
.spinwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.rlabel{font-family:var(--display);font-size:20px;display:flex;justify-content:space-between;align-items:end}
.rlabel b{font-family:var(--body);font-weight:900;font-size:15px;color:var(--gold)}
.reel{position:relative;height:150px;border:4px solid var(--ink);border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,#0a1f4d,#163d8a);box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 6px 0 var(--ink)}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.reel::before{left:0;background:linear-gradient(90deg,#0a1f4d,transparent)}
.reel::after{right:0;background:linear-gradient(-90deg,#0a1f4d,transparent)}
.marker{position:absolute;left:50%;top:-2px;z-index:3;transform:translateX(-50%);width:0;height:0;border:12px solid transparent;border-top:16px solid var(--gold);filter:drop-shadow(0 2px 0 var(--ink))}
.marker.b{top:auto;bottom:-2px;border-top:12px solid transparent;border-bottom:16px solid var(--gold)}
.strip{position:absolute;top:15px;left:0;display:flex;gap:10px;will-change:transform}
.rc{width:104px;height:120px;flex:none;border-radius:16px;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:inset 0 4px 0 #fff5}
img.em.im{display:block;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.rc img.em.im{width:84px;height:84px}
.rc .em{font-size:58px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.rc .nm{font-size:10.5px;font-weight:900;text-align:center;padding:2px 4px;line-height:1.05;text-shadow:0 1px 0 #000}
.rc.win{animation:winpop .6s ease-out;outline:4px solid var(--gold);outline-offset:-2px}
@keyframes winpop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1.08)}}
.vs{font-family:var(--display);font-size:54px;text-align:center;color:var(--red);text-shadow:0 4px 0 var(--ink);-webkit-text-stroke:2px var(--ink);line-height:1;opacity:0;transform:scale(.3)}
.vs.on{animation:vsin .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes vsin{to{opacity:1;transform:scale(1) rotate(-6deg)}}

/* Battle */
.arena{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:4px;min-height:0;position:relative;overflow:visible}
.fighter{display:flex;flex-wrap:nowrap;align-items:center;gap:12px;position:relative;min-width:0}
.fighter.top{flex-direction:row-reverse;text-align:right}
.por{--ps:min(30vw,15vh,124px);position:relative;width:var(--ps);height:var(--ps);flex:none;border-radius:26px;border:4px solid var(--ink);
  background:radial-gradient(circle at 50% 35%,#fff6,transparent 60%),linear-gradient(180deg,var(--g1),var(--g2));
  box-shadow:0 7px 0 var(--ink),inset 0 -8px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.por .em{font-size:calc(var(--ps)*.62);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.fighter.top .por .em{transform:scaleX(-1)}
.fighter.top .por .em.hue{transform:scaleX(-1)}
.shield{position:absolute;inset:-12px;border-radius:34px;border:4px solid var(--cyan);background:radial-gradient(circle,transparent 55%,#6ff3ff55);
  box-shadow:0 0 22px var(--cyan),inset 0 0 18px var(--cyan);opacity:0;transform:scale(.6);transition:opacity .25s,transform .3s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.shield.on{opacity:1;transform:scale(1);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 34px var(--cyan),inset 0 0 26px var(--cyan)}}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.fighter.top .info{align-items:flex-end}
.who{font-size:12px;font-weight:900;opacity:.85;text-transform:uppercase;letter-spacing:1px}
.fname{font-family:var(--display);font-size:clamp(17px,5.2vw,24px);line-height:1.05;text-shadow:0 3px 0 var(--ink);overflow-wrap:anywhere}
.badge{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:8px;border:2px solid var(--ink);background:var(--g2);text-shadow:0 1px 0 #000}
.hp{display:flex;align-items:center;width:100%;max-width:230px}
.fighter.top .hp{align-self:flex-end}
.hpb{position:relative;z-index:2;flex:none;min-width:36px;height:36px;padding:0 5px;display:flex;align-items:center;justify-content:center;border-radius:9px;border:3px solid #0d1a33;background:linear-gradient(180deg,var(--hb1),var(--hb2));font-family:var(--display);font-size:23px;line-height:1;color:#fff;text-shadow:0 2px 0 #0d1a33;-webkit-text-stroke:1px #0d1a33;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 3px 0 #0d1a33;margin-right:-9px;font-variant-numeric:tabular-nums}
.hpt{flex:1;min-width:0;height:22px;border:3px solid #0d1a33;border-radius:0 8px 8px 0;background:#1a2747;overflow:hidden;box-shadow:0 3px 0 #0d1a33}
.hpf{display:block;height:100%;background:linear-gradient(180deg,var(--hf1) 0 34%,var(--hf2) 34% 100%);box-shadow:inset -2px 0 0 rgba(0,0,0,.25);transition:width .35s ease-out}
.hp.blue{--hb1:#6db6ff;--hb2:#2563d4;--hf1:#a9e2ff;--hf2:#3c9bec}
.hp.red{--hb1:#ff7d6b;--hb2:#c8261f;--hf1:#ffb9ad;--hf2:#e9473b}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.turn{font-family:var(--display);font-size:18px;padding:6px 16px;border-radius:999px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:var(--blue)}
.turn.mine{background:var(--green)}
.turn.theirs{background:var(--red)}
.log{min-height:38px;font-weight:800;font-size:15px;line-height:1.3;max-width:40ch;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:6px;padding-bottom:4px;flex:none}
.actions .btn{font-size:16px;padding:8px 6px;min-height:clamp(54px,8.5vh,70px);line-height:1.05}
.actions .btn .ic{font-size:22px;display:block;margin-bottom:2px}
.actions .btn.used{opacity:.55}
.actions .btn.armed{box-shadow:0 6px 0 var(--ink),0 0 18px var(--cyan);outline:3px solid var(--white);outline-offset:-6px}
.cycle{grid-column:1/-1;text-align:center;font-size:12px;opacity:.85;font-weight:800}

/* FX */
.lunge-up{animation:lu .45s ease-in-out}
@keyframes lu{40%{transform:translateY(-38px) scale(1.12) rotate(-4deg)}}
.lunge-down{animation:ld .45s ease-in-out}
@keyframes ld{40%{transform:translateY(38px) scale(1.12) rotate(4deg)}}
.hit{animation:hit .35s}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}20%{transform:translateX(-10px) rotate(-4deg);filter:brightness(3) saturate(0)}50%{transform:translateX(9px) rotate(3deg)}75%{transform:translateX(-5px)}}
.quake{animation:quake .4s}
@keyframes quake{25%{transform:translate(6px,-4px)}50%{transform:translate(-6px,4px)}75%{transform:translate(4px,2px)}}
.float{position:absolute;left:50%;top:30%;z-index:20;pointer-events:none;font-family:var(--display);font-size:46px;transform:translate(-50%,0);
  -webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);animation:floatup 1s ease-out forwards;white-space:nowrap}
.float.dmg{color:var(--red)} .float.heal{color:#8dff6a} .float.miss{color:#fff;font-size:30px} .float.blk{color:var(--cyan);font-size:28px}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.4)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.25)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.banner{position:fixed;left:0;right:0;top:42%;z-index:30;text-align:center;pointer-events:none;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(90deg,transparent,rgba(10,20,60,.9) 15%,rgba(10,20,60,.9) 85%,transparent);
  font-family:var(--display);font-size:clamp(24px,7vw,34px);line-height:1.1;text-shadow:0 3px 0 #000;animation:bannerin 1.7s ease forwards}
.banner span{color:var(--gold)}
@keyframes bannerin{0%{opacity:0;transform:scaleY(0)}12%{opacity:1;transform:scaleY(1)}85%{opacity:1}100%{opacity:0}}

/* Over */
.over{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(circle,rgba(10,30,80,.55),rgba(5,10,30,.9));
  padding:20px max(24px,env(safe-area-inset-right,0px)) 20px max(24px,env(safe-area-inset-left,0px))}
.over h2{margin:0;font-family:var(--display);font-size:clamp(44px,13vw,68px);color:var(--gold);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--gold-d),0 9px 0 var(--ink);animation:vsin .6s cubic-bezier(.2,1.6,.4,1) forwards;opacity:0;transform:scale(.3)}
.over h2.lose{color:#c9d6ff;text-shadow:0 5px 0 #5a6aa0,0 9px 0 var(--ink)}
.over .champ{font-size:110px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.4));animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.over .btns{display:flex;flex-direction:column;gap:14px;width:min(100%,320px)}
#confetti{position:fixed;inset:0;z-index:41;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--red);border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:900;box-shadow:0 4px 0 var(--ink);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

</head>
<body>
<button class="mute" id="mute" aria-label="Sonido">🔊</button>
<div id="app">
  <!-- HOME -->
  <section class="screen" id="s-home">
    <div class="logo"><h1>FURIA<br>ANIMAL</h1><div class="sub">de Tino</div></div>
    <div class="parade" aria-hidden="true"><span id="parade"></span></div>
    <div class="menu">
      <div class="namebox"><label for="nm">Tu nombre</label><input id="nm" maxlength="14" value="" placeholder="Pon tu nombre" autocomplete="off"></div>
      <button class="btn b-gold" id="go-cpu">Contra la máquina<small>Peleá contra un animal de la compu</small></button>
      <button class="btn b-green" id="go-wa">Invitar por WhatsApp<small>Le mandás un link y entra directo</small></button>
      <button class="btn b-cyan" id="go-online">Unirme con código<small>Si te pasaron un número de sala</small></button>
      <button class="btn b-blue" id="go-hot">Dos jugadores, un celu<small>Se pasan el teléfono por turno</small></button>
      <div class="foot">114 animales · 5 tipos de ataque · 1 escudo · <span id="ver"></span></div>
    </div>
  </section>

  <!-- INVITE (link de WhatsApp) -->
  <section class="screen" id="s-invite" hidden>
    <div class="center">
      <div class="logo" style="margin-top:0"><h1 style="font-size:clamp(40px,12vw,60px)">FURIA<br>ANIMAL</h1></div>
      <div class="card" style="display:flex;flex-direction:column;gap:14px">
        <div class="t" id="inv-who" style="font-size:28px;text-align:center">¡Te desafiaron!</div>
        <div class="muted" id="inv-room">Sala</div>
        <div class="namebox"><label for="nm2">Tu nombre</label><input id="nm2" maxlength="14" placeholder="Pon tu nombre" autocomplete="off" enterkeyhint="go"></div>
        <button class="btn b-green" id="inv-go">¡Entrar a pelear!</button>
      </div>
      <button class="btn b-blue" data-back>Ir al menú</button>
    </div>
  </section>

  <!-- CPU LEVEL -->
  <section class="screen" id="s-level" hidden>
    <div class="center">
      <div class="t" style="font-size:34px;text-align:center">Elegí el nivel</div>
      <button class="btn b-green" data-lvl="f">Fácil<small>La máquina se equivoca y no usa escudo</small></button>
      <button class="btn b-gold" data-lvl="m">Medio<small>Ataca bien y a veces usa el escudo</small></button>
      <button class="btn b-red" data-lvl="d">Difícil<small>Piensa cada jugada y siempre es más rápida</small></button>
      <button class="btn b-blue" data-back>Volver</button>
    </div>
  </section>

  <!-- ONLINE MENU -->
  <section class="screen" id="s-online" hidden>
    <div class="center">
      <div class="t" style="font-size:34px;text-align:center">Jugar online</div>
      <div class="card" style="display:flex;flex-direction:column;gap:14px">
        <button class="btn b-gold" id="host">Crear sala<small>Te doy un código para tu amigo</small></button>
        <div class="muted">o</div>
        <div style="display:flex;gap:10px;align-items:center">
          <label for="code" class="t" style="font-size:18px">Código</label>
          <input id="code" class="codein" maxlength="4" inputmode="numeric" placeholder="1234" autocomplete="off">
        </div>
        <button class="btn b-green" id="join">Unirme</button>
      </div>
      <button class="btn b-red" data-back>Volver</button>
    </div>
  </section>

  <!-- LOBBY -->
  <section class="screen" id="s-lobby" hidden>
    <div class="center">
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <div class="muted" id="lobby-top">Pasale este código a tu amigo</div>
        <div class="bigcode" id="lobby-code">----</div>
        <div class="muted" id="lobby-msg"><span class="dots">Esperando rival</span></div>
        <div id="share" style="display:flex;flex-direction:column;gap:12px">
          <button class="btn b-green" id="wa">Mandar por WhatsApp</button>
          <button class="btn b-blue" id="copy">Copiar link</button>
        </div>
      </div>
      <button class="btn b-red" data-back>Cancelar</button>
    </div>
  </section>

  <!-- SPIN -->
  <section class="screen" id="s-spin" hidden>
    <div class="spinwrap">
      <div class="rlabel"><span id="r-top-n">Rival</span><b id="r-top-a"></b></div>
      <div class="reel" id="reel-top"><div class="marker"></div><div class="marker b"></div><div class="strip"></div></div>
      <div class="vs" id="vs">VS</div>
      <div class="rlabel"><span id="r-bot-n">Vos</span><b id="r-bot-a"></b></div>
      <div class="reel" id="reel-bot"><div class="marker"></div><div class="marker b"></div><div class="strip"></div></div>
    </div>
  </section>

  <!-- BATTLE -->
  <section class="screen" id="s-battle" hidden>
    <div class="arena" id="arena">
      <div class="fighter top" id="f-top"></div>
      <div class="mid"><div class="turn" id="turn">—</div><div class="log" id="log"></div></div>
      <div class="fighter" id="f-bot"></div>
    </div>
    <div class="actions" id="actions"></div>
  </section>

/* ---------- ENGINE ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
const ri=n=>Math.floor(Math.random()*n);
function mk(a){return{a,hp:10,def:false,dc:0,used:[]}}
function newGame(names){
  const a=ri(A.length);let b=ri(A.length);while(b===a)b=ri(A.length);
  const S={phase:'spin',id:Date.now()%1e9,seq:0,names,p:[mk(a),mk(b)],log:null,winner:-1};
  const s0=A[a].s,s1=A[b].s;S.tie=s0===s1;S.turn=s0>s1?0:s1>s0?1:ri(2);
  return S;
}
function canAct(S,who,act){
  if(S.phase!=='battle'||S.turn!==who)return false;
  const me=S.p[who];
  if(act.k!=='atk'||!(act.i>=0&&act.i<3)||me.used.includes(act.i))return false;
  if(act.d&&(me.def||me.dc>=2))return false;
  return true;
}
function applyAct(S,who,act){
  if(!canAct(S,who,act))return false;
  const me=S.p[who],op=S.p[1-who];
  const L={seq:S.seq+1,by:who,k:act.k};
  if(act.d){me.def=true;me.dc++;L.armed=true}
  {
    const atk=A[me.a].atk[act.i];L.i=act.i;L.t=atk.t;
    me.used.push(act.i);if(me.used.length>=3)me.used=[];
    let hits=[],pierce=false;
    if(atk.t==='G')hits=[3];
    else if(atk.t==='F'){if(Math.random()<.7)hits=[4];else L.miss=true}
    else if(atk.t==='R'){hits=[2];pierce=true}
    else if(atk.t==='V')hits=[2];
    else if(atk.t==='C')hits=Math.random()<.5?[1,1]:[1,1,1];
    const dm=[];
    for(const h of hits){
      let d=h;
      if(op.def){op.def=false;if(pierce)L.broke=true;else{d=Math.max(1,Math.floor(h/2));L.blk=true}}
      dm.push(d);
    }
    L.dm=dm;L.tot=dm.reduce((x,y)=>x+y,0);
    op.hp=Math.max(0,op.hp-L.tot);
    if(atk.t==='V'&&L.tot>0&&me.hp<10){me.hp+=1;L.heal=1}
  }
  S.seq++;S.log=L;S.turn=1-who;
  if(op.hp<=0){S.phase='over';S.winner=who}
  return true;
}

function noise(d=.18,v=.25){if(muted||!AC)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=900;s.buffer=b;g.gain.value=v;s.connect(fl).connect(g).connect(AC.destination);s.start()}

/* ---------- SPIN ---------- */
const CW=114;
function buildStrip(reel,target){
  const strip=reel.querySelector('.strip');const N=46,T=40;let h='';
  for(let i=0;i<N;i++){const a=i===T?target:ri(A.length);h+=`<div class="rc" style="${gstyle(a)}">${emo(a)}<div class="nm">${esc(A[a].n)}</div></div>`}
  strip.innerHTML=h;strip.style.transform='translateX(0)';return{strip,T}
}
function spinReel(reel,target,dur,delay){
  return new Promise(res=>{
    const {strip,T}=buildStrip(reel,target);
    const w=reel.clientWidth,end=-(T*CW-(w/2-52));
    let t0=null,last=0;
    const step=ts=>{if(t0===null)t0=ts+delay;const k=Math.min(1,Math.max(0,(ts-t0)/dur));
      const e=1-Math.pow(1-k,4);const x=end*e;strip.style.transform=`translateX(${x}px)`;
      const c=Math.floor(-x/CW);if(c!==last){last=c;SFX.tick()}
      if(k<1)requestAnimationFrame(step);else{strip.children[T].classList.add('win');SFX.land();res()}};
    requestAnimationFrame(step);
  })
}
async function doSpin(){
  spinning=true;show('s-spin');$('vs').classList.remove('on');
  const opp=1-ME,top=S.p[opp].a,bot=S.p[ME].a;
  $('r-top-n').textContent=S.names[opp];$('r-bot-n').textContent=S.names[ME]+(MODE==='hot'?'':' (vos)');
  $('r-top-a').textContent='';$('r-bot-a').textContent='';
  const sid=S.id;
  await Promise.all([
    spinReel($('reel-bot'),bot,3000,0).then(()=>$('r-bot-a').textContent=A[bot].n),
    spinReel($('reel-top'),top,3000,700).then(()=>$('r-top-a').textContent=A[top].n)
  ]);
  $('vs').classList.add('on');SFX.big();
  await new Promise(r=>setTimeout(r,1300));
  spinning=false;
  if(S.id!==sid)return render();
  if(MODE!=='guest'&&S.phase==='spin'){const ns=clone(S);ns.phase='battle';setState(ns)}else render();
}

/* ---------- CPU ---------- */
function scheduleCpu(){
  clearTimeout(cpuTimer);const id=S.seq;
  cpuTimer=setTimeout(()=>{
    if(!S||MODE!=='cpu'||S.seq!==id||S.turn!==1||busy||S.phase!=='battle')return;
    const me=S.p[1],op=S.p[0],at=A[me.a].atk;
    const opts=[0,1,2].filter(i=>!me.used.includes(i));
    const canSh=!me.def&&me.dc<2;let choice;
    if(LVL==='f'){
      const weak={R:0,C:1,V:2,F:3,G:4};opts.sort((x,y)=>weak[at[x].t]-weak[at[y].t]);
      choice={k:'atk',i:Math.random()<.6?opts[0]:opts[ri(opts.length)],d:false};
    }else if(LVL==='m'){
      const score=i=>{const t=at[i].t;if(op.hp<=3)return{G:5,F:3,V:3,R:2,C:2}[t];return{F:4,G:4,V:3,C:2,R:2}[t]+Math.random()*2};
      opts.sort((x,y)=>score(y)-score(x));
      choice={k:'atk',i:opts[0],d:canSh&&Math.random()<(me.hp<=5?.45:.22)};
    }else{
      // difícil: remata, se cura cuando está bajo y pone escudo si el rival tiene un golpe fuerte guardado
      const sure={G:3,R:2,V:2,C:2,F:0},avg={G:3,F:2.8,R:2,V:2.6,C:2.5};
      const score=i=>{const t=at[i].t;
        if(sure[t]>=op.hp)return 100+sure[t];
        let v=avg[t];if(t==='V'&&me.hp<=6)v+=1.5;if(t==='F'&&op.hp===4)v+=.8;return v+Math.random()*.3};
      opts.sort((x,y)=>score(y)-score(x));
      const opAt=A[op.a].atk,opLeft=[0,1,2].filter(i=>!op.used.includes(i)).map(i=>opAt[i].t);
      const danger=opLeft.includes('F')||opLeft.includes('G');
      const dying=me.hp<=4;
      choice={k:'atk',i:opts[0],d:canSh&&score(opts[0])<100&&(dying||(danger&&(me.hp<=7||me.dc===0&&Math.random()<.5)))};
    }
    const ns=clone(S);applyAct(ns,1,choice);setState(ns);
  },1000);
}

function confetti(){

}

/* ---------- ONLINE (MQTT por dos servidores públicos a la vez) ---------- */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
let cls=[],base=null,hb=null,joinTimer=null,leaving=false,code=null,guestId=null,lastN=0,lastSeen=0,gid=null,myN=0,hostSeen=false;
const rid=()=>Math.random().toString(36).slice(2,10);
function netConnect(sub,onMsg){
  return new Promise(res=>{
    if(!window.mqtt)return res(false);
    let ok=false;const done=v=>{if(!ok){ok=true;res(v)}};
    BROKERS.forEach(u=>{try{
      const c=mqtt.connect(u,{clientId:'fa_'+rid(),clean:true,connectTimeout:7000,reconnectPeriod:2500,keepalive:30});
      c.on('connect',()=>{c.subscribe(base+'/'+sub,{qos:1});done(true)});
      c.on('message',(t,p)=>{if(!p||!p.length)return;let d;try{d=JSON.parse(p.toString())}catch(e){return}if(d&&typeof d==='object')onMsg(d)});
      c.on('error',()=>{});
      cls.push(c);
    }catch(e){}});
    setTimeout(()=>done(false),9000);
  });
}
function pub(sub,d,retain){const m=JSON.stringify(d);cls.forEach(c=>{if(c.connected)c.publish(base+'/'+sub,m,{qos:1,retain:!!retain})})}
function leaveRoom(){
  leaving=true;clearInterval(hb);clearTimeout(joinTimer);
  if(base&&cls.length){if(MODE==='host')pub('h',{t:'closed',ts:Date.now()},true);else if(MODE==='guest')pub('g',{t:'bye',gid})}
  const old=cls;cls=[];setTimeout(()=>old.forEach(c=>{try{c.end(true)}catch(e){}}),500);
  setTimeout(()=>leaving=false,300);
}
function lost(msg){if(leaving||!MODE)return;toast(msg);toMenu()}
function noNet(){toast('No pude conectar. Revisá que tengas internet y probá de nuevo.',5000)}
async function hostGame(){
  readName();if(!window.mqtt)return noNet();
  leaveRoom();leaving=false;code=String(1000+ri(9000));base='furiaanimal-tino/'+code;
  MODE='host';ME=0;S={phase:'lobby',id:0,names:[myName,'']};spunId=null;introId=null;guestId=null;lastN=0;
  $('lobby-top').textContent='Tu sala';$('share').hidden=false;$('lobby-code').textContent=code;
  $('lobby-msg').innerHTML='<span class="dots">Creando sala</span>';show('s-lobby');
  const ok=await netConnect('g',hostMsg);
  if(MODE!=='host')return;
  if(!ok){noNet();return toMenu()}
  pub('h',{t:'lobby',ts:Date.now()},true);
  $('lobby-msg').innerHTML='<span class="dots">Esperando rival</span><br><small>Cuando tu amigo abra el link, la pelea arranca sola.</small>';
  hb=setInterval(()=>{
    if(S.phase==='lobby')pub('h',{t:'lobby',ts:Date.now()},true);else pushHost();
    if(guestId&&Date.now()-lastSeen>35000)lost('Tu rival se fue.');
  },8000);
}
function hostMsg(d){
  if(d.t==='hello'){
    if(!guestId&&S.phase==='lobby'){guestId=d.gid;lastSeen=Date.now();lastN=0;SFX.land();animSeq=0;setState(newGame([myName,String(d.nm||'Rival').slice(0,14)]))}
    else if(d.gid===guestId){lastSeen=Date.now();pushHost()}
    return;
  }
  if(!guestId||d.gid!==guestId)return;
  lastSeen=Date.now();
  if(d.t==='ping')return;
  if(d.t==='bye')return lost('Tu rival se fue.');
  if(!(d.n>lastN))return;lastN=d.n;
  if(d.t==='again'){if(S.phase==='over'){closeOver();animSeq=0;setState(newGame(S.names))}return}
  if(d.t==='act'){const ns=clone(S);if(applyAct(ns,1,{k:d.k,i:d.i,d:!!d.sh}))setState(ns);else pushHost()}
}
function pushHost(){if(base)pub('h',{t:'st',st:S,gid:guestId,ts:Date.now()},true)}
async function joinGame(){
  readName();const c=($('code').value||'').replace(/\D/g,'');
  if(c.length!==4)return toast('El código tiene 4 números.');
  if(!window.mqtt)return noNet();
  leaveRoom();leaving=false;base='furiaanimal-tino/'+c;
  MODE='guest';ME=1;S=null;spunId=null;introId=null;animSeq=0;gid=rid();myN=0;hostSeen=false;
  $('lobby-top').textContent='Entrando a la sala';$('share').hidden=true;$('lobby-code').textContent=c;$('lobby-msg').innerHTML='<span class="dots">Conectando</span>';
  show('s-lobby');
  const ok=await netConnect('h',guestMsg);
  if(MODE!=='guest')return;
  if(!ok){noNet();return toMenu()}
  pub('g',{t:'hello',gid,nm:myName});
  joinTimer=setTimeout(()=>{if(!hostSeen)lost('No encontré esa sala. Revisá el código.')},12000);
  hb=setInterval(()=>{
    pub('g',S?{t:'ping',gid}:{t:'hello',gid,nm:myName});
    if(hostSeen&&Date.now()-lastSeen>35000)lost('Tu rival se fue.');
  },8000);
}
function guestMsg(d){
  if(d.ts&&Date.now()-d.ts>90000)return;
  if(d.t==='closed'){if(hostSeen)lost('Tu rival se fue.');return}
  if(d.t==='lobby'){hostSeen=true;lastSeen=Date.now();if(!S)pub('g',{t:'hello',gid,nm:myName});return}
  if(d.t!=='st'||!d.st)return;
  if(d.gid!==gid){if(!S)lost('Esa sala ya tiene dos jugadores.');return}
  hostSeen=true;lastSeen=Date.now();
  const st=d.st;if(st.phase==='lobby')return;
  if(!S||st.seq!==S.seq||st.id!==S.id||st.phase!==S.phase){
    if(S&&st.id!==S.id)closeOver();
    S=st;if(!(S.log&&S.log.seq>animSeq))busy=false;render()}
}

  const go=()=>{audio();$('nm').value=$('nm2').value.trim()||'Amigo';joinGame()};
  $('inv-go').onclick=go;$('nm2').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
  show('s-invite')})();
$('host').onclick=hostGame;$('join').onclick=joinGame;
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=toMenu);
</script>
