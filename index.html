<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1556c4">
<title>Furia Animal</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Furia Animal">
<style>html,body{margin:0;height:100%;background:#1556c4;color:#fff;font:800 18px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}</style>
</head>
<body>
<div id="msg">Cargando…</div>
<script>
// Cargador: siempre baja la última versión del juego, salteando el cache.
fetch('game.html?t=' + Date.now(), {cache: 'no-store'})
  .then(function (r) { if (!r.ok) throw 0; return r.text(); })
  .then(function (html) { document.open(); document.write(html); document.close(); })
  .catch(function () { document.getElementById('msg').innerHTML = 'No pude cargar el juego.<br>Revisá tu internet y recargá.'; });
</script>
</body>
</html>
